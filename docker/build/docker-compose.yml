# Modern in-kernel driver (kernel 5.11+): uses /dev/sgx_enclave and /dev/sgx_provision.
# Old out-of-tree driver: replace /dev/sgx_enclave with /dev/isgx and drop /dev/sgx_provision.
# With the legacy Launch Enclave driver the AESM is REQUIRED (it issues launch tokens), so
# keep the aesm service up: compose runs it by default -- do NOT set USE_AESM=0 there.
#

# version kept for docker-compose < 1.27.0 (Debian 10, Ubuntu 20.04, RHEL 8); ignored by Compose v2.
version: '3'

# SGX_GID / SGX_PRV_GID are exported by build_compose_run.sh (host group GIDs are
# dynamic, not stable). Default 65534 (nogroup) applies when run without it.
#
# The SGX SDK sample built here (e.g. SampleEnclave) does NOT use the AESM today: with
# the Flexible/in-kernel Launch Control driver, launch happens without it. The aesm
# service is only needed by the legacy Launch Enclave driver (AESM serves launch tokens).
# It is kept wired up here because the layout generalizes to DCAP quote-generation samples,
# which genuinely talk to the AESM over this socket for PCE/QE3. The standalone
# build_and_run_sample_deb_docker.sh makes the AESM optional via USE_AESM (default off).
services:
  aesm:
    image: sgx_aesm
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    group_add:
      - "${SGX_GID:-65534}"      # host "sgx" group
      - "${SGX_PRV_GID:-65534}"  # host "sgx_prv" group
    volumes:
      - aesmd-socket:/var/run/aesmd
    stdin_open: true
    tty: true
    environment:
      - http_proxy
      - https_proxy
      # Bypass the proxy for the in-cluster PCCS (host default + peer); host no_proxy appended.
      - no_proxy=host.docker.internal,pccs,localhost,127.0.0.1,${no_proxy:-}

  sample:
    image: sgx_sample
    depends_on:
      - aesm
    devices:
      - /dev/sgx_enclave
    group_add:
      - "${SGX_GID:-65534}"      # host "sgx" group
    volumes:
      - aesmd-socket:/var/run/aesmd
    stdin_open: true
    tty: true
    environment:
      - http_proxy
      - https_proxy

volumes:
  aesmd-socket:
    external: true
