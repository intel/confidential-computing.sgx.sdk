# Modern in-kernel driver (kernel 5.11+): uses /dev/sgx_enclave and /dev/sgx_provision.
#

# version kept for docker-compose < 1.27.0 (Debian 10, Ubuntu 20.04, RHEL 8); ignored by Compose v2.
version: '3'

# SGX_GID are exported by build_compose_run.sh (host group GIDs are
# dynamic, not stable). When a group is absent the fallback is a harmless placeholder
# GID (nobody/nogroup-range); the two fallbacks are deliberately DIFFERENT so Compose's
# duplicate-item check passes when neither SGX group exists on the host.
#
# The SGX SDK sample built here (e.g. SampleEnclave) does NOT use the AESM today: with
# the in-kernel Launch Control driver, launch happens without it.
services:
  sample:
    image: sgx_sample
    devices:
      - /dev/sgx_enclave
    group_add:
      - "${SGX_GID:-65534}"      # host "sgx" group
    stdin_open: true
    tty: true
    environment:
      - http_proxy
      - https_proxy
